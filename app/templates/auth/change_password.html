{% extends "base.html" %}
{% block title %}Actualizar Contraseña Temporal · Alerta Pluvial{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
  <div class="col-md-7 col-lg-5">
    <div class="card card-pm p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-icon-box mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.6rem; background: linear-gradient(135deg, #0b2540, #0e5277);">
          <i class="bi bi-key-fill text-warning"></i>
        </div>
        <h1 class="h4 fw-bold mb-1">Actualizar Contraseña Temporal</h1>
        <p class="text-muted small mb-0">Por seguridad (OWASP A07), debes definir una clave personal robusta antes de usar tu cuenta.</p>
      </div>

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="password" class="form-label small fw-semibold text-muted">Nueva contraseña (mín. 8 caracteres, mayúscula, minúscula y dígito)</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="mb-4">
          <label for="confirm_password" class="form-label small fw-semibold text-muted">Confirmar nueva contraseña</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">Guardar Nueva Contraseña</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
